<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" rx="30" fill="#0E131F"/>
  <rect x="2" y="2" width="796" height="596" rx="28" stroke="url(#paint0_linear)" stroke-width="2"/>
  
  <!-- Subtle Grid -->
  <g opacity="0.15">
    <path d="M0 100H800M0 200H800M0 300H800M0 400H800M0 500H800" stroke="#00D2FF" stroke-width="1"/>
    <path d="M100 0V600M200 0V600M300 0V600M400 0V600M500 0V600M600 0V600M700 0V600" stroke="#00D2FF" stroke-width="1"/>
  </g>

  <!-- Glowing Glow behind Card -->
  <circle cx="400" cy="300" r="180" fill="#0070F3" opacity="0.12" filter="blur(60px)"/>

  <!-- Document Card Mockup -->
  <rect x="240" y="120" width="320" height="360" rx="16" fill="#141A29" stroke="#00D2FF" stroke-width="1.5" stroke-opacity="0.5"/>
  
  <!-- Header Bar -->
  <rect x="270" y="160" width="160" height="14" rx="4" fill="#00D2FF"/>
  <rect x="270" y="190" width="220" height="8" rx="4" fill="#94A3B8" opacity="0.6"/>
  <rect x="270" y="210" width="180" height="8" rx="4" fill="#94A3B8" opacity="0.4"/>

  <!-- QR Code Scanning Graphic -->
  <rect x="270" y="250" width="120" height="120" rx="12" fill="#090D16" stroke="#38BDF8" stroke-width="2"/>
  <!-- QR markers -->
  <rect x="282" y="262" width="28" height="28" rx="4" fill="#38BDF8"/>
  <rect x="288" y="268" width="16" height="16" rx="2" fill="#090D16"/>
  <rect x="350" y="262" width="28" height="28" rx="4" fill="#38BDF8"/>
  <rect x="356" y="268" width="16" height="16" rx="2" fill="#090D16"/>
  <rect x="282" y="330" width="28" height="28" rx="4" fill="#38BDF8"/>
  <rect x="288" y="336" width="16" height="16" rx="2" fill="#090D16"/>
  <!-- QR bits -->
  <rect x="325" y="270" width="10" height="10" fill="#38BDF8"/>
  <rect x="340" y="310" width="12" height="12" fill="#38BDF8"/>
  <rect x="325" y="340" width="15" height="15" fill="#38BDF8"/>
  <rect x="350" y="335" width="8" height="8" fill="#38BDF8"/>

  <!-- Printing Status Badge -->
  <g transform="translate(410, 260)">
    <rect width="120" height="36" rx="18" fill="#0070F3" fill-opacity="0.2" stroke="#0070F3" stroke-width="1"/>
    <circle cx="20" cy="18" r="5" fill="#00E5FF"/>
    <text x="35" y="23" fill="#E2E8F0" font-family="'Kanit', sans-serif" font-size="12" font-weight="600">READY TO PRINT</text>
  </g>
  <g transform="translate(410, 310)">
    <rect width="120" height="36" rx="18" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="20" y="23" fill="#94A3B8" font-family="'Kanit', sans-serif" font-size="12" font-weight="500">Fast Upload</text>
  </g>
  <g transform="translate(410, 360)">
    <rect width="120" height="36" rx="18" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="20" y="23" fill="#94A3B8" font-family="'Kanit', sans-serif" font-size="12" font-weight="500">Secure Pay</text>
  </g>

  <!-- Title Bottom -->
  <text x="270" y="440" fill="#FFFFFF" font-family="'Kanit', sans-serif" font-size="22" font-weight="700" letter-spacing="1">PRINTFLOW PLATFORM</text>
  <text x="270" y="462" fill="#64748B" font-family="'Kanit', sans-serif" font-size="12">Smart Document Upload &amp; Cloud Queue</text>

  <defs>
    <linearGradient id="paint0_linear" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00D2FF" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#0070F3" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#00D2FF" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
</svg>
